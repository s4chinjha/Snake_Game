<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Snake Game</title>

    <script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        #game {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

<div id="game"></div>

<script type="module">
    await cheerpjInit({ version: 17 });

    cheerpjCreateDisplay(
        -1,
        -1,
        document.getElementById("game")
    );

    await cheerpjRunJar("/app/SnakeGame.jar");
</script>

</body>
</html>
